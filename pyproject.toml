[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "migconvert"
version = "0.1.0"
description = "Convert SQL migration files between goose and dbmate annotation formats"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ebbrown2" }]

[project.scripts]
migconvert = "migconvert.cli:main"

[tool.setuptools]
packages = ["migconvert"]
